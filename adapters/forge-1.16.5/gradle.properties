org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# ---- Project coordinates ----
mod_id=steambridge
mod_name=Steam Bridge
mod_group=steambridge
# ---- Platform versions ----
minecraft_version=1.16.5
# MinecraftForge recommended for 1.16.5 (files.minecraftforge.net).
forge_version=1.16.5-36.2.42
# Official Mojang method/field names; class names stay MCP-style until 1.17.
mappings_channel=official
mappings_version=1.16.5

# ---- Runtime deps ----
steamworks4j_version=1.10.0
# Forge 1.16.5 already ships net.java.dev.jna:jna:4.4.0 on the game library path
# (see version JSON). Do NOT shade a different JNA into the mod jar - that fights
# the game copy and leaves a broken Native clinit ("incompatible JNA native library").
jna_version=4.4.0
