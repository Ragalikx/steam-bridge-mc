modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/Ragalikx/steam-bridge-mc/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Ragalikx"
credits="Ragalikx - author; Valve - Steam SDR; code-disaster - steamworks4j; java-native-access - JNA"

displayTest="IGNORE_ALL_VERSION"
description='''
Steam Bridge - play Minecraft with friends without exposing your IP.

Players connect via SteamID over P2P/SDR relay - no port-forwarding, works through NAT.
Symmetric NAT automatically falls back to Valve SDR relay.

Requires Steam (AppID 480 - Spacewar) to be running.'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47.1.106,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="CLIENT"
