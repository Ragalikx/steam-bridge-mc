name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - forge-1.7.10
          - forge-1.8.9
          - forge-1.12.2
          - forge-1.16.5
          - forge-1.19.2
          - fabric-1.19.2
          - fabric-1.20.1
          - fabric-1.21.1
          - neoforge-1.20.1
          - neoforge-1.21.1
          - neoforge-26.x
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: corretto
          java-version: |
            8
            21
            25
            17
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/build.py --variant ${{ matrix.variant }} --version 0.0.0-${{ github.sha }}
        env:
          JAVA_HOME_8: ${{ env.JAVA_HOME_8_X64 }}
          JAVA_HOME_17: ${{ env.JAVA_HOME_17_X64 }}
          JAVA_HOME_21: ${{ env.JAVA_HOME_21_X64 }}
          JAVA_HOME_25: ${{ env.JAVA_HOME_25_X64 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.variant }}
          path: |
            dist/windows-x64/*.jar
            dist/addons/*.jar
