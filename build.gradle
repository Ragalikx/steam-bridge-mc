plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

// -- Versioning ----------------------------------------------------------------
// Release (cmd):        gradlew build -PmodVersion=1.145
// Release (PowerShell): .\gradlew.bat build "-PmodVersion=1.145"   // quotes required:
//                       bare 1.145 is split so Gradle sees task ".145"
// Result: project.version / jar / neoforge.mods.toml / BuildInfo = "1.145+mc1.21.1"
// Dev (no -P):          "0.0.0-dev+mc1.21.1"
// Optional leading "v" is stripped (CI: -PmodVersion=v1.145).
// Do NOT use positional "gradlew build 1.145" - Gradle treats that as a task name.
def rawModVersion = (findProperty('modVersion') ?: '0.0.0-dev').toString().trim()
if (rawModVersion.isEmpty()) {
    throw new GradleException("modVersion is empty. Pass -PmodVersion=1.145 (or omit for 0.0.0-dev).")
}
if (rawModVersion.startsWith('v') || rawModVersion.startsWith('V')) {
    rawModVersion = rawModVersion.substring(1)
}
// Reject accidental full strings that already contain +mc… (avoid 1.145+mc1.21.1+mc1.21.1).
if (rawModVersion.contains('+mc')) {
    throw new GradleException(
        "modVersion must be the mod release only (e.g. 1.145), not '${rawModVersion}'. " +
        "Minecraft is appended automatically as +mc${minecraft_version}."
    )
}

ext.modVersionOnly = rawModVersion
version = "${rawModVersion}+mc${minecraft_version}"
group   = project.mod_group

logger.lifecycle("Steam Bridge version: {}  (modVersion={}, minecraft={})",
    version, rawModVersion, minecraft_version)

base {
    archivesName = project.mod_id
}

// Mojang ships Java 21 to end-users starting in 1.20.5; NeoForge 1.21.1 requires it.
// foojay-resolver in settings.gradle auto-provisions JDK 21 for compilation.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// -- Auto-generated BuildInfo (author/version stamped into bytecode) -----------
def generatedSrcDir = layout.buildDirectory.dir('generated/java').get().asFile

sourceSets {
    main { java { srcDir generatedSrcDir } }
}

tasks.register('generateBuildInfo') {
    def verFull = project.version.toString()
    def verMod  = project.ext.modVersionOnly.toString()
    def verMc   = project.minecraft_version.toString()
    inputs.property('version', verFull)
    inputs.property('modVersion', verMod)
    inputs.property('minecraftVersion', verMc)
    outputs.dir(generatedSrcDir)
    doFirst {
        def f = new File("${generatedSrcDir}/steambridge/BuildInfo.java")
        f.parentFile.mkdirs()
        f.text = """\
package steambridge;
/** Auto-generated at build time. Do not edit or commit. */
public final class BuildInfo {
    /** Full release id, e.g. {@code 1.145+mc1.21.1}. */
    public static final String VERSION     = "${verFull}";
    /** Mod-only version from {@code -PmodVersion}, e.g. {@code 1.145}. */
    public static final String MOD_VERSION = "${verMod}";
    /** Target Minecraft version baked at build time. */
    public static final String MC_VERSION  = "${verMc}";
    /** Embedded in bytecode - visible in hex/strings dump of the jar. */
    public static final String AUTHOR      = "Ragalikx";
    public static final String GITHUB      = "https://github.com/Ragalikx/steam-bridge-mc";
    private BuildInfo() {}
}
"""
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'generateBuildInfo'
    options.encoding = 'UTF-8'
}

// -- NeoForge 1.21.1 toolchain -------------------------------------------------
// NeoGradle 7.x (net.neoforged.gradle.userdev) for 1.21.1+. Unlike the legacyforge
// preset used for 1.17-1.20.1, there is NO reobfuscation step: NeoForge 1.21+
// ships with official Mojang names at runtime, so the compiled jar is shipped as-is.
// Access transformers (META-INF/accesstransformer.cfg) are also declared in
// neoforge.mods.toml; listing them here applies them at compile time too.
minecraft {
    accessTransformers {
        file 'src/main/resources/META-INF/accesstransformer.cfg'
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {}
}

repositories {
    mavenCentral()
}

// Resolved (transitive-free) copy of the steamworks4j artifact, used only to pull its Java
// API classes + win64 native DLLs into the mod jar (see the jar task).
configurations {
    steamBundle { transitive = false }
}

// -- Steam bridge native deps ---------------------------------------------------------
//
// steamworks4j: its Java API classes are shaded FLAT into the mod jar (see the jar task).
// `com.codedisaster.steamworks` is a package no other mod or the loader provides,
// so there is no split-package/module clash.
//
// JNA: NOT bundled at all. NeoForge itself always ships JNA at runtime; compile against
// the exact version the 1.21.1 loader provides (compileOnly) and let the game supply it.
// (See the 1.20.1 build for the three failed bundling approaches.)
dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    compileOnly "net.java.dev.jna:jna:${project.jna_version}"

    implementation("com.code-disaster.steamworks4j:steamworks4j:${project.steamworks4j_version}") {
        exclude group: 'net.java.dev.jna'
    }

    steamBundle "com.code-disaster.steamworks4j:steamworks4j:${project.steamworks4j_version}"
}

// -- Resource templating (neoforge.mods.toml version substitution) ------------
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_version            : project.version,
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : project.neo_version,
        neo_version_range      : project.neo_version_range,
        loader_version_range   : project.loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    // Shade steamworks4j's Java API classes flat into the mod jar, and lay the win64 Steam
    // native binaries FLAT at the jar root (steam_api64.dll / steamworks4j64.dll).
    // Only win64: 1.21.1 requires 64-bit Java, macOS/Linux natives stripped.
    from({ project.configurations.steamBundle.collect { zipTree(it) } }) {
        include 'com/codedisaster/**'
        include 'steam_api64.dll', 'steamworks4j64.dll'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Implementation-Title'  : project.mod_id,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Ragalikx',
            'Implementation-URL'    : 'https://github.com/Ragalikx/steam-bridge-mc',
            'Built-By'              : 'Ragalikx'
        ])
    }
}
