plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

def buildDate    = new Date()
version          = "1.${buildDate.format('yyMMdd')}"
group            = project.mod_group

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// -- Auto-generated BuildInfo (author/version stamped into bytecode) -----------
def generatedSrcDir = layout.buildDirectory.dir('generated/java').get().asFile

sourceSets {
    main { java { srcDir generatedSrcDir } }
}

tasks.register('generateBuildInfo') {
    outputs.dir(generatedSrcDir)
    doFirst {
        def f = new File("${generatedSrcDir}/steambridge/BuildInfo.java")
        f.parentFile.mkdirs()
        f.text = """\
package steambridge;
/** Auto-generated at build time. Do not edit or commit. */
public final class BuildInfo {
    public static final String VERSION     = "${project.version}";
    /** Embedded in bytecode - visible in hex/strings dump of the jar. */
    public static final String AUTHOR      = "Ragalikx";
    public static final String GITHUB      = "https://github.com/Ragalikx/steam-bridge-mc";
    private BuildInfo() {}
}
"""
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn 'generateBuildInfo'
    options.encoding = 'UTF-8'
}

// -- NeoForge (legacy/Forge-compat) toolchain ----------------------------------
// ModDevGradle's "legacyforge" preset targets MinecraftForge/NeoForge 1.17-1.20.1.
// Unlike the old net.neoforged.gradle.userdev plugin, it automatically wires up
// reobfuscation (official Mojang mappings -> the SRG names the shipped game runs
// with) for the 'jar' task - obfuscateJar defaults to true, so no extra config needed.
legacyForge {
    // Use neoForgeVersion (net.neoforged:forge coordinate), NOT the version= shorthand,
    // which resolves net.minecraftforge:forge (real MinecraftForge) instead of NeoForge.
    enable {
        neoForgeVersion = project.neoforge_version
    }

    runs {
        client {
            client()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// Resolved (transitive-free) copy of the steamworks4j artifact, used only to pull its Java
// API classes + win64 native DLLs into the mod jar (see the jar task). It is NOT a classpath
// config - compilation/dev-runtime get steamworks4j via `implementation` below.
configurations {
    steamBundle { transitive = false }
}

// -- Steam bridge native deps ---------------------------------------------------------
//
// steamworks4j: its Java API classes are shaded FLAT into the mod jar (see the jar task),
// exactly as the 1.12.2 build did. `com.codedisaster.steamworks` is a package no other mod
// or the loader provides, so there is no split-package/module clash; the classes just ride
// along in the steambridge automatic module and reach JNA (a named module the loader always
// ships) through the implicit reads every automatic module gets. This is both smaller and
// simpler than Jar-in-Jar, which nested the *entire* upstream jar - including ~2.3 MB of
// macOS/Linux/32-bit natives this Windows-only mod never loads.
//
// JNA: NOT bundled at all - three approaches were tried for that and all failed:
//  1. shadowJar + relocate(com.sun.jna -> steambridge.shaded.com.sun.jna): breaks JNA's
//     native bootstrap (jnidispatch.dll's exported symbols are compiled against the
//     original `com.sun.jna.Native` class name -> UnsatisfiedLinkError at class-init).
//  2. shadowJar without relocation: NeoForge's production launch resolves JNA as a real
//     Java *module* on the module path (`-p ...jna-5.12.1.jar`); our mod jar becomes an
//     automatic module that also exports the unrelocated `com.sun.jna` package, and the
//     JPMS module resolver refuses two modules exporting the same package
//     (`ResolutionException: Modules steambridge and com.sun.jna export package
//     com.sun.jna to module forge`).
//  3. jarJar-embedding our own JNA copy: NeoForge's loader *also* exposes jar-in-jar
//     GAMELIBRARY dependencies as real modules on the same layer, so our embedded
//     jna-5.14.0 and the loader's own jna-5.12.1 both register as a module named
//     "com.sun.jna" -> `ResolutionException: Module steambridge reads more than one
//     module named com.sun.jna`.
// NeoForge itself depends on and always ships JNA at runtime, so the fix is to not bundle
// a second copy at all: compile against it (compileOnly, pinned to the exact version the
// 1.20.1 loader provides) and let the game supply the real one.
dependencies {
    compileOnly "net.java.dev.jna:jna:${project.jna_version}"

    // Compile + dev-runtime classpath for the steamworks4j API. Not auto-bundled by the
    // default `jar` task (only jarJar does that) - we copy its classes in ourselves.
    implementation("com.code-disaster.steamworks4j:steamworks4j:${project.steamworks4j_version}") {
        exclude group: 'net.java.dev.jna' // the loader provides JNA; never pull a second copy
    }

    steamBundle "com.code-disaster.steamworks4j:steamworks4j:${project.steamworks4j_version}"
}

// -- Resource templating (mods.toml version substitution) ---------------------
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        mod_id           : project.mod_id,
        mod_name         : project.mod_name,
        mod_version      : project.version,
        minecraft_version: project.minecraft_version,
        neoforge_version : project.neoforge_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    // Shade steamworks4j's Java API classes flat into the mod jar, and lay the win64 Steam
    // native binaries FLAT at the jar root (steam_api64.dll / steamworks4j64.dll).
    // SteamManager's loader reads the DLLs via getClass().getResourceAsStream("/steam_api64.dll")
    // - getClass() belongs to THIS mod jar, so the DLLs must be resolvable from the mod jar's
    // own classloader at its root. Everything else in the upstream artifact is dropped:
    // the macOS/Linux natives (unsupported) and the 32-bit DLLs (1.20.1 requires 64-bit Java).
    from({ project.configurations.steamBundle.collect { zipTree(it) } }) {
        include 'com/codedisaster/**'                    // steamworks4j Java API
        include 'steam_api64.dll', 'steamworks4j64.dll'  // win64 natives only, at the jar root
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Implementation-Title'  : project.mod_id,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Ragalikx',
            'Implementation-URL'    : 'https://github.com/Ragalikx/steam-bridge-mc',
            'Built-By'              : 'Ragalikx'
        ])
    }
}
