plugins {
    id 'base'
}

allprojects {
    group = 'steambridge'
    version = findProperty('modVersion') ?: '0.0.0-dev'
    repositories {
        mavenCentral()
        maven { url 'https://repo.plasmoverse.com/releases' }
        maven { url 'https://repo.spongepowered.org/repository/maven-public' }
        maven { url 'https://maven.maxhenkel.de/repository/public' }
    }
}

subprojects {
    apply plugin: 'java-library'
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
    }
    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }
    tasks.withType(Test).configureEach {
        useJUnit()
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        if (System.getenv('SBM_TEST_JAVA_HOME')) {
            executable = new File(System.getenv('SBM_TEST_JAVA_HOME'),
                    System.getProperty('os.name').toLowerCase().contains('win') ? 'bin/java.exe' : 'bin/java')
        }
    }
}

tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }

apply from: 'build-logic/dependency-checks.gradle'
