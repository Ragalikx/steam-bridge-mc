buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

// -- Versioning ----------------------------------------------------------------
// Release:  gradlew build "-PmodVersion=1.0.0"
// Result:   project.version / jar / mcmod.info / BuildInfo = "1.0.0+mc1.8.9"
// Dev:      "0.0.0-dev+mc1.8.9"
// No voice-chat / UDP intercept on this branch (host Steam P2P + GUI only).
ext.minecraft_version = '1.8.9'
def rawModVersion = (findProperty('modVersion') ?: '0.0.0-dev').toString().trim()
if (rawModVersion.isEmpty()) {
    throw new GradleException("modVersion is empty. Pass -PmodVersion=1.0.0 (or omit for 0.0.0-dev).")
}
if (rawModVersion.startsWith('v') || rawModVersion.startsWith('V')) {
    rawModVersion = rawModVersion.substring(1)
}
if (rawModVersion.contains('+mc')) {
    throw new GradleException(
        "modVersion must be the mod release only (e.g. 1.0.0), not '${rawModVersion}'. " +
        "Minecraft is appended automatically as +mc${minecraft_version}."
    )
}
ext.modVersionOnly = rawModVersion
version = "${rawModVersion}+mc${minecraft_version}"
group = 'steambridge'
archivesBaseName = 'steambridge'

logger.lifecycle("Steam Bridge (Forge 1.8.9) version: {}  (modVersion={}, minecraft={})",
    version, rawModVersion, minecraft_version)

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

def generatedSrcDir = "${buildDir}/generated/java"
sourceSets {
    main { java { srcDir generatedSrcDir } }
}

task generateBuildInfo {
    def verFull = project.version.toString()
    def verMod = project.ext.modVersionOnly.toString()
    def verMc = project.ext.minecraft_version.toString()
    inputs.property('version', verFull)
    inputs.property('modVersion', verMod)
    inputs.property('minecraftVersion', verMc)
    outputs.dir(generatedSrcDir)
    doFirst {
        def f = new File("${generatedSrcDir}/steambridge/BuildInfo.java")
        f.parentFile.mkdirs()
        f.text = """\
package steambridge;
/** Auto-generated at build time. Do not edit or commit. */
public final class BuildInfo {
    /** Full release id, e.g. {@code 1.0.0+mc1.8.9}. */
    public static final String VERSION     = "${verFull}";
    /** Mod-only version from {@code -PmodVersion}. */
    public static final String MOD_VERSION = "${verMod}";
    /** Target Minecraft version baked at build time. */
    public static final String MC_VERSION  = "${verMc}";
    public static final String AUTHOR      = "Ragalikx";
    public static final String GITHUB      = "https://github.com/Ragalikx/steam-bridge-mc";
    private BuildInfo() {}
}
"""
    }
}

tasks.withType(JavaCompile) {
    dependsOn generateBuildInfo
    options.encoding = 'UTF-8'
}

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
    makeObfSourceJar = false
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    shade('com.code-disaster.steamworks4j:steamworks4j:1.10.0') { transitive = false }
    shade('net.java.dev.jna:jna:5.14.0') { transitive = false }
}

jar {
    from('third_party_licenses') { into 'META-INF/licenses' }
    from('LICENSE') { into 'META-INF/licenses'; rename { 'STEAMBRIDGE_MIT.txt' } }
    exclude 'module-info.class'
    exclude 'META-INF/versions/**'

    exclude 'com/sun/jna/darwin*/**'
    exclude 'com/sun/jna/linux*/**'
    exclude 'com/sun/jna/sunos*/**'
    exclude 'com/sun/jna/freebsd*/**'
    exclude 'com/sun/jna/openbsd*/**'
    exclude 'com/sun/jna/aix*/**'
    exclude 'com/sun/jna/win32-x86/**'
    exclude 'com/sun/jna/win32-aarch64/**'
    exclude '**/ELFAnalyser*'
    exclude 'com/sun/jna/win32/**'
    exclude '**/Native$AWT*'
    exclude '**/ptr/ShortByReference*'
    exclude '**/ptr/DoubleByReference*'
    exclude '**/ptr/ByteByReference*'
    exclude '**/ptr/FloatByReference*'
    exclude '**/ptr/IntByReference*'
    exclude '**/ptr/NativeLongByReference*'
    exclude '**/NativeLong.class'
    exclude '**/WString.class'
    exclude 'META-INF/AL2.0'
    exclude 'META-INF/LGPL2.1'

    exclude 'libsteam_api.dylib'
    exclude 'libsteamworks4j.dylib'
    exclude 'libsteam_api.so'
    exclude 'libsteamworks4j.so'
    exclude 'steam_api.dll'
    exclude 'steamworks4j.dll'

    exclude 'com/codedisaster/steamworks/SteamController*'
    exclude 'com/codedisaster/steamworks/SteamHTTP*'
    exclude 'com/codedisaster/steamworks/SteamLeaderboard*'
    exclude 'com/codedisaster/steamworks/SteamMatchmaking*'
    exclude 'com/codedisaster/steamworks/SteamNetworking*'
    exclude 'com/codedisaster/steamworks/SteamPublishedFile*'
    exclude 'com/codedisaster/steamworks/SteamRemoteStorage*'
    exclude 'com/codedisaster/steamworks/SteamScreenshot*'
    exclude 'com/codedisaster/steamworks/SteamServer*'
    exclude 'com/codedisaster/steamworks/SteamUGC*'
    exclude 'com/codedisaster/steamworks/SteamUserStats*'

    manifest {
        attributes([
            'Specification-Title'   : 'steambridge',
            'Implementation-Title'  : 'steambridge',
            'Implementation-Version': version,
            'Implementation-Vendor' : 'Ragalikx',
            'Implementation-URL'    : 'https://github.com/Ragalikx/steam-bridge-mc',
            'Built-By'              : 'Ragalikx',
            'FMLAT'                 : 'steambridge_at.cfg'
        ])
    }
    from { configurations.shade.collect { it.isDirectory() ? it : zipTree(it) } }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.ext.minecraft_version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.ext.minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}

tasks.matching { it.name == 'build' }.configureEach {
    doLast {
        def libs = file("${buildDir}/libs")
        def jars = libs.exists()
            ? libs.listFiles({ d, n -> n.endsWith('.jar') && !n.endsWith('-sources.jar') } as FilenameFilter)
            : null
        logger.lifecycle('------------------------------------------------------------')
        logger.lifecycle(' Steam Bridge (Forge {})  version = {}', project.ext.minecraft_version, project.version)
        if (jars != null) {
            jars.sort { a, b -> a.name <=> b.name }.each { j ->
                logger.lifecycle(' Artifact: {}', j.absolutePath)
            }
        }
        logger.lifecycle('------------------------------------------------------------')
    }
}
