modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"
issueTrackerURL="https://github.com/Ragalikx/steam-bridge-mc/issues"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Ragalikx"
credits="Ragalikx (author); Valve (Steam SDR); code-disaster (steamworks4j); java-native-access (JNA)"
displayTest="IGNORE_ALL_VERSION"
description='''
Steam Bridge: play Minecraft with friends without exposing your IP.

Players connect via SteamID over P2P/SDR relay with no port-forwarding; works through NAT.
Symmetric NAT automatically falls back to Valve SDR relay.

Requires Steam (AppID 480, Spacewar) to be running.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[mixins]]
config="steambridge.mixins.json"
